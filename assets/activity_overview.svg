<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230" fill="none">
  <defs>
    <linearGradient id="bg-activity" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>

    <linearGradient id="commit-line-grad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulse-dot {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.3); opacity: 1; filter: drop-shadow(0 0 6px #3fb950); }
      }

      @keyframes radar-pulse {
        0% { r: 5; opacity: 0.8; }
        100% { r: 16; opacity: 0; }
      }

      @keyframes bar-expand {
        0% { stroke-dashoffset: 95; }
        100% { stroke-dashoffset: 0; }
      }

      .pulse-target {
        transform-origin: 575px 115px;
        animation: pulse-dot 2.5s ease-in-out infinite;
      }

      .radar-wave {
        animation: radar-pulse 2.5s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }

      .animated-commit-vector {
        stroke-dasharray: 95;
        animation: bar-expand 1.2s ease-out forwards;
      }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect width="880" height="230" rx="10" fill="url(#bg-activity)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Divider Line Between Left & Right Panes -->
  <line x1="440" y1="20" x2="440" y2="210" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- LEFT PANE: Activity Overview Details & Telemetry -->
  <g transform="translate(36, 28)">
    <!-- Header -->
    <text x="0" y="16" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600">Activity overview</text>

    <!-- Contribution Focus -->
    <g transform="translate(0, 40)">
      <!-- Repo Icon -->
      <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5v-9zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8V1.5z" fill="#7d8590" transform="translate(0, 2)" />
      
      <text x="22" y="13" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">
        Contributed to verified core repositories:
      </text>

      <!-- Active Repos Tags (Cleanly Stacked) -->
      <g transform="translate(22, 30)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
        <text x="0" y="0" fill="#58a6ff">cv-template</text>
        <text x="95" y="0" fill="#7d8590">&#8226;</text>
        <text x="110" y="0" fill="#58a6ff">smart-image-document-detector</text>
        
        <text x="0" y="22" fill="#58a6ff">Anime-Recommendation-Generator</text>
        <text x="240" y="22" fill="#7d8590">&#8226;</text>
        <text x="255" y="22" fill="#58a6ff">Portfolio-v2</text>
      </g>
    </g>

    <!-- Verified Metrics Ticker -->
    <g transform="translate(0, 122)">
      <rect width="380" height="34" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#238636" />
      <text x="30" y="21" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">
        Activity distribution: <tspan fill="#3fb950" font-weight="700">100% Commits</tspan>
      </text>
    </g>
  </g>

  <!-- RIGHT PANE: 4-Axis Activity Overview Crosshair Chart -->
  <!-- Crosshair Center: cx = 660, cy = 115 -->
  <g>
    <!-- Vertical Axis: Code review (top) to Pull requests (bottom) -->
    <line x1="660" y1="42" x2="660" y2="188" stroke="#30363d" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Horizontal Axis: Commits (left) to Issues (right) -->
    <line x1="565" y1="115" x2="755" y2="115" stroke="#30363d" stroke-width="1.5" stroke-linecap="round" />

    <!-- Crosshair Center Tick -->
    <circle cx="660" cy="115" r="2.5" fill="#484f58" />

    <!-- Axis Labels -->
    <!-- Top: Code review -->
    <text x="660" y="32" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Code review</text>

    <!-- Bottom: Pull requests -->
    <text x="660" y="204" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle">Pull requests</text>

    <!-- Right: Issues -->
    <text x="768" y="119" fill="#7d8590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="start">Issues</text>

    <!-- Left: 100% Commits -->
    <text x="535" y="112" fill="#3fb950" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" text-anchor="end">100%</text>
    <text x="535" y="126" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" text-anchor="end">Commits</text>

    <!-- The 100% Commits Vector (Extends from center 660 to left 575) -->
    <line x1="660" y1="115" x2="575" y2="115" stroke="url(#commit-line-grad)" stroke-width="2.5" stroke-linecap="round" class="animated-commit-vector" />

    <!-- Animated Radar Pulse Rings at Commit Node (x = 575, y = 115) -->
    <circle cx="575" cy="115" r="5" stroke="#3fb950" stroke-width="1.5" fill="none" class="radar-wave" />
    
    <!-- Target Point -->
    <circle cx="575" cy="115" r="4.5" fill="#3fb950" stroke="#0d1117" stroke-width="1.5" filter="url(#green-glow)" />
    <circle cx="575" cy="115" r="2" fill="#ffffff" />
  </g>
</svg>
