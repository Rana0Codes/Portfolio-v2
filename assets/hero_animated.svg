<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" fill="none">
  <defs>
    <!-- Deep Spatial Background Gradients -->
    <linearGradient id="bg-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e" />
      <stop offset="40%" stop-color="#080c18" />
      <stop offset="75%" stop-color="#0e0c1a" />
      <stop offset="100%" stop-color="#05050a" />
    </linearGradient>

    <!-- Specular Bezel Border -->
    <linearGradient id="hero-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4500" stop-opacity="0.4" />
      <stop offset="35%" stop-color="#ffaa00" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#00f0ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.35" />
    </linearGradient>

    <!-- Fire Gradients -->
    <linearGradient id="fire-core" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff275" />
      <stop offset="60%" stop-color="#ff5500" />
      <stop offset="100%" stop-color="#ff0044" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="lava-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#ffaa00" stop-opacity="0.75" />
      <stop offset="70%" stop-color="#ff2200" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bird-aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#0066ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Dragon Skin and Armor Gradients -->
    <linearGradient id="dragon-armor" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2438" />
      <stop offset="50%" stop-color="#121624" />
      <stop offset="100%" stop-color="#0a0d16" />
    </linearGradient>

    <linearGradient id="dragon-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5500" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffaa00" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.2" />
    </linearGradient>

    <!-- Filters -->
    <filter id="fire-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="frost-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- CSS Keyframe Choreography (6.0s Game Loop Sequence) -->
    <style><![CDATA[
      /* 1. Dragon Breathing and Rearing */
      @keyframes dragon-cycle {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        25% { transform: translateY(3px) rotate(-1deg); } /* Inhale / Crouch */
        40% { transform: translateY(-5px) rotate(2deg); } /* Roar and Fire blast */
        70% { transform: translateY(-2px) rotate(1deg); } /* Sustained blast */
        85% { transform: translateY(0px) rotate(0deg); } /* Recoil and Cooldown */
      }

      /* 2. Dragon Jaw Opening */
      @keyframes jaw-roar {
        0%, 25%, 85%, 100% { transform: rotate(0deg); }
        35%, 70% { transform: rotate(18deg); } /* Jaw drops open for fire */
      }

      /* 3. Dragon Wing Flapping */
      @keyframes wing-flap {
        0%, 100% { transform: rotate(0deg) scaleY(1); }
        30% { transform: rotate(-8deg) scaleY(1.08); }
        50% { transform: rotate(6deg) scaleY(0.92); }
        75% { transform: rotate(-5deg) scaleY(1.04); }
      }

      /* 4. Fire Breath Stream (Charges, blasts forward, misses bird, dissipates) */
      @keyframes fire-eruption {
        0%, 30% {
          opacity: 0;
          transform: scaleX(0.05) scaleY(0.2);
        }
        36% {
          opacity: 0.95;
          transform: scaleX(0.7) scaleY(0.8);
        }
        42%, 65% {
          opacity: 1;
          transform: scaleX(1) scaleY(1.05); /* Peak torrent */
        }
        75% {
          opacity: 0.6;
          transform: scaleX(0.9) scaleY(0.5);
        }
        82%, 100% {
          opacity: 0;
          transform: scaleX(0.2) scaleY(0.1);
        }
      }

      /* 5. Sky Phoenix/Bird Dive, Attack and Evasive Dodge Arc */
      @keyframes bird-flight-path {
        0% {
          /* Emerging from top sky */
          transform: translate(0px, 0px) rotate(22deg);
        }
        28% {
          /* Swooping down fast towards dragon's lair */
          transform: translate(-130px, 58px) rotate(32deg);
        }
        38% {
          /* Apex attack point: Sees fire erupting! */
          transform: translate(-195px, 72px) rotate(15deg);
        }
        46% {
          /* EVASIVE DODGE: Sharp bank upwards and barrel roll, narrowly avoiding flame */
          transform: translate(-255px, 15px) rotate(-35deg) scale(1.05);
        }
        60% {
          /* Climbing high above the fire plume */
          transform: translate(-310px, -22px) rotate(-22deg) scale(0.95);
        }
        80% {
          /* Circling back around through sky */
          transform: translate(-170px, -26px) rotate(-6deg) scale(0.88);
        }
        100% {
          /* Back to entry point */
          transform: translate(0px, 0px) rotate(22deg);
        }
      }

      /* 6. Bird Wing Flap Cycle */
      @keyframes bird-wings {
        0%, 100% { transform: scaleY(1); }
        50% { transform: scaleY(-0.65); }
      }

      /* 7. Ember Particle Drifts */
      @keyframes ember-float-1 {
        0% { transform: translate(0, 0) scale(1); opacity: 0; }
        40% { opacity: 0.9; }
        100% { transform: translate(-180px, -55px) scale(0.2); opacity: 0; }
      }

      @keyframes ember-float-2 {
        0% { transform: translate(0, 0) scale(1); opacity: 0; }
        45% { opacity: 1; }
        100% { transform: translate(-150px, -85px) scale(0.1); opacity: 0; }
      }

      @keyframes ember-float-3 {
        0% { transform: translate(0, 0) scale(1); opacity: 0; }
        50% { opacity: 0.85; }
        100% { transform: translate(-220px, -35px) scale(0.3); opacity: 0; }
      }

      /* 8. Dragon Throat Lava Heat Pulse */
      @keyframes lava-pulse {
        0%, 20% { opacity: 0.3; }
        35%, 65% { opacity: 1; filter: drop-shadow(0 0 12px #ff4500); }
        80%, 100% { opacity: 0.35; }
      }

      /* Class Assignments */
      .dragon-rig {
        transform-origin: 750px 220px;
        animation: dragon-cycle 6s ease-in-out infinite;
      }

      .dragon-wing {
        transform-origin: 755px 145px;
        animation: wing-flap 2.2s ease-in-out infinite;
      }

      .dragon-jaw {
        transform-origin: 678px 148px;
        animation: jaw-roar 6s ease-in-out infinite;
      }

      .flame-breath {
        transform-origin: 660px 146px;
        animation: fire-eruption 6s cubic-bezier(0.25, 0.9, 0.3, 1) infinite;
      }

      .phoenix-rig {
        animation: bird-flight-path 6s cubic-bezier(0.38, 0.04, 0.2, 0.98) infinite;
      }

      .bird-wings-motion {
        transform-origin: 0px 0px;
        animation: bird-wings 0.32s ease-in-out infinite;
      }

      .throat-lava {
        animation: lava-pulse 6s ease-in-out infinite;
      }

      .ember-p1 { animation: ember-float-1 3.5s linear infinite; }
      .ember-p2 { animation: ember-float-2 4.2s linear infinite 0.8s; }
      .ember-p3 { animation: ember-float-3 3.8s linear infinite 1.5s; }
    ]]></style>
  </defs>

  <!-- Container Surface with Specular Bezel -->
  <rect width="880" height="280" rx="16" fill="url(#bg-sky)" stroke="url(#hero-border)" stroke-width="1.2" filter="url(#card-shadow)" />

  <!-- Background Cyber Mountains and Dark Horizon -->
  <g opacity="0.35">
    <!-- Distant Mountain Peaks -->
    <polygon points="460,280 540,195 620,280" fill="#0c1020" />
    <polygon points="580,280 670,180 750,280" fill="#0e1326" />
    <polygon points="700,280 780,190 860,280" fill="#090d1a" />
    <!-- Floating Dragon Island / Obsidian Cliff -->
    <path d="M 620,280 L 650,210 L 730,190 L 820,205 L 880,280 Z" fill="#131728" stroke="#1f2640" stroke-width="1" />
  </g>

  <!-- Background Stars / Spark Field -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="480" cy="45" r="1" />
    <circle cx="530" cy="85" r="1.2" opacity="0.8" />
    <circle cx="610" cy="35" r="0.8" />
    <circle cx="670" cy="70" r="1.5" opacity="0.6" />
    <circle cx="790" cy="40" r="1" />
    <circle cx="830" cy="95" r="1.2" />
    <circle cx="450" cy="140" r="0.7" />
    <circle cx="510" cy="170" r="1.3" opacity="0.7" />
  </g>

  <!-- LEFT COLUMN: Prestigious Developer Identity (No project mention / No launcher) -->
  <g transform="translate(48, 46)">
    <!-- Status Pill -->
    <g transform="translate(0, 0)">
      <rect width="235" height="25" rx="12.5" fill="rgba(255, 69, 0, 0.08)" stroke="rgba(255, 69, 0, 0.3)" stroke-width="1" />
      <circle cx="14" cy="12.5" r="4.5" fill="#ff4500" />
      <circle cx="14" cy="12.5" r="2" fill="#ffffff" />
      <text x="27" y="16.5" fill="#ffaa00" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="10.5" font-weight="600" letter-spacing="0.5">OPEN TO SELECT COLLABORATION</text>
    </g>

    <!-- Name and Handle -->
    <g transform="translate(0, 62)">
      <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.8">JUYEL RANA</text>
      <text x="232" y="-2" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16.5" font-weight="500">/ @Rana0Codes</text>
    </g>

    <!-- Core Title -->
    <text x="0" y="94" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
      Full-Stack Developer &amp; Systems Builder
    </text>

    <!-- Professional Attributes (Clean, confident, zero project links) -->
    <g transform="translate(0, 126)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" fill="#94a3b8">
      <text x="0" y="0">
        <tspan fill="#ff4500">&gt;</tspan> clean architecture
        <tspan dx="14" fill="#ffaa00">&#8226;</tspan><tspan dx="8">creative web graphics</tspan>
      </text>
      <text x="0" y="24">
        <tspan fill="#ff4500">&gt;</tspan> high-velocity delivery
        <tspan dx="14" fill="#00f0ff">&#8226;</tspan><tspan dx="8">robust cloud systems</tspan>
      </text>
    </g>

    <!-- Atmospheric Story Line / Developer Sigil -->
    <g transform="translate(0, 186)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9.5" fill="#64748b">
      <text x="0" y="0">
        <tspan fill="#ff5500">&#9670;</tspan> BATTLE SIMULATION: DRAGON VS PHOENIX &#8226; PROCEDURAL LOOP
      </text>
    </g>
  </g>

  <!-- RIGHT COLUMN: THE EPIC DRAGON VS SKY BIRD BATTLE ARENA -->

  <!-- 1. DRAGON STAGE (Rigged on Obsidian Mountain Cliff at right) -->
  <g class="dragon-rig">
    <!-- Lava Glow Behind Dragon Body -->
    <circle cx="735" cy="180" r="55" fill="url(#lava-glow)" class="throat-lava" opacity="0.4" />

    <!-- Dragon Tail with Armored Dorsal Spikes -->
    <path d="M 800,225 C 835,235 860,205 845,175 C 835,155 815,165 825,185 C 832,200 810,215 780,210 Z" fill="url(#dragon-armor)" stroke="#ff4500" stroke-width="0.8" stroke-opacity="0.6" />
    <polygon points="840,165 850,155 845,175" fill="#ff5500" />
    <polygon points="852,190 865,185 852,202" fill="#ffaa00" />

    <!-- Dragon Large Wing (Flapping behind/above body) -->
    <g class="dragon-wing">
      <!-- Wing Struts / Bones -->
      <path d="M 745,155 C 725,95 780,55 835,70 C 815,95 790,120 760,155 Z" fill="url(#dragon-armor)" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.5" />
      <!-- Wing Membrane Panels -->
      <polygon points="760,155 835,70 810,115" fill="rgba(255, 69, 0, 0.15)" />
      <polygon points="760,155 810,115 785,140" fill="rgba(255, 170, 0, 0.2)" />
      <!-- Wing Claw Talon -->
      <polygon points="835,70 844,62 837,74" fill="#ffffff" />
    </g>

    <!-- Dragon Torso and Muscular Shoulders -->
    <path d="M 710,160 C 720,135 750,135 775,155 C 800,175 790,225 765,225 C 730,225 700,200 710,160 Z" fill="url(#dragon-armor)" stroke="#2a3352" stroke-width="1.2" />

    <!-- Chest Armor Plates (Glowing Heat Lines) -->
    <path d="M 718,168 Q 735,178 748,165" stroke="#ff4500" stroke-width="2" fill="none" opacity="0.85" />
    <path d="M 715,182 Q 732,192 748,178" stroke="#ffaa00" stroke-width="1.8" fill="none" opacity="0.8" />
    <path d="M 720,196 Q 735,204 748,192" stroke="#ff5500" stroke-width="1.5" fill="none" opacity="0.75" />

    <!-- Front Claw Perched on Rock -->
    <path d="M 695,215 L 720,205 L 728,225 L 715,228 Z" fill="#0d111c" stroke="#ffaa00" stroke-width="0.8" />
    <polygon points="695,215 686,218 698,222" fill="#ffffff" />
    <polygon points="702,223 695,228 707,227" fill="#ffffff" />

    <!-- Dragon Neck (Arching forward aggressively) -->
    <path d="M 725,150 C 715,120 685,125 675,138 C 690,155 705,160 725,150 Z" fill="url(#dragon-armor)" />

    <!-- Throat Lava Core (Incandescent Fire Energy) -->
    <path d="M 682,136 Q 695,142 705,134" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#fire-bloom)" class="throat-lava" />
    <path d="M 680,136 Q 695,144 710,135" stroke="#ff5500" stroke-width="5" stroke-linecap="round" filter="url(#fire-bloom)" class="throat-lava" opacity="0.8" />

    <!-- Dragon Head and Horns -->
    <g transform="translate(640, 105)">
      <!-- Sweeping Crown Horns -->
      <path d="M 45,28 C 65,12 85,5 95,2 C 85,15 72,25 55,34 Z" fill="#0e1322" stroke="#ff4500" stroke-width="1" />
      <path d="M 42,32 C 60,24 75,18 85,16 C 75,26 65,34 50,38 Z" fill="#1c243c" stroke="#ffaa00" stroke-width="0.8" />

      <!-- Head Skull Plate -->
      <polygon points="15,42 45,28 58,40 38,55 18,52" fill="url(#dragon-armor)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />

      <!-- Fierce Glowing Amber/Red Eye -->
      <polygon points="32,38 40,36 36,41" fill="#ffffff" filter="url(#fire-bloom)" />
      <polygon points="30,38 42,35 38,42" fill="#ff0000" />

      <!-- Snout and Upper Jaw -->
      <path d="M 15,42 L 38,40 L 40,48 L 10,48 Z" fill="#121626" stroke="#ff4500" stroke-width="0.8" />
      <!-- Upper Fangs -->
      <polygon points="14,48 12,54 16,49" fill="#ffffff" />
      <polygon points="22,48 20,53 24,49" fill="#ffffff" />

      <!-- Animated Lower Jaw (Drops open during flame breath) -->
      <g class="dragon-jaw">
        <path d="M 38,48 L 12,51 L 22,58 L 40,54 Z" fill="#0a0d18" stroke="#ff5500" stroke-width="0.8" />
        <!-- Lower Fangs -->
        <polygon points="16,51 15,46 19,51" fill="#ffffff" />
        <polygon points="24,51 23,47 27,51" fill="#ffffff" />
      </g>
    </g>
  </g>

  <!-- 2. THE FEROCIOUS BREATHING FIRE BLAST (Unleashed towards the Sky Bird!) -->
  <g class="flame-breath">
    <!-- Huge Outer Heat Distortion Cone -->
    <path d="M 645,145 Q 520,105 380,85 Q 510,175 645,160 Z" fill="rgba(255, 69, 0, 0.22)" filter="url(#fire-bloom)" />

    <!-- Primary Roaring Fire Tongue -->
    <path d="M 650,146 Q 540,115 410,95 Q 490,140 430,120 Q 550,170 650,154 Z" fill="url(#fire-core)" filter="url(#fire-bloom)" />

    <!-- Central White-Hot Plasma Jet -->
    <path d="M 652,148 Q 570,130 460,110 Q 540,148 652,152 Z" fill="#ffffff" filter="url(#fire-bloom)" opacity="0.95" />

    <!-- Fiery Blast Vortex Rings / Shockwaves -->
    <ellipse cx="580" cy="138" rx="14" ry="24" stroke="#ffea00" stroke-width="2.5" fill="none" opacity="0.8" filter="url(#fire-bloom)" transform="rotate(-15 580 138)" />
    <ellipse cx="490" cy="120" rx="20" ry="34" stroke="#ff3700" stroke-width="2" fill="none" opacity="0.7" filter="url(#fire-bloom)" transform="rotate(-20 490 120)" />

    <!-- Swirling Fire Embers / Particles shooting leftwards -->
    <circle cx="430" cy="105" r="3.5" fill="#ffffff" class="ember-p1" filter="url(#fire-bloom)" />
    <circle cx="480" cy="90" r="4" fill="#ffaa00" class="ember-p2" filter="url(#fire-bloom)" />
    <circle cx="390" cy="115" r="3" fill="#ff3300" class="ember-p3" filter="url(#fire-bloom)" />
    <circle cx="520" cy="155" r="2.5" fill="#ffea00" class="ember-p1" />
  </g>

  <!-- 3. SKY PHOENIX / CELESTIAL BIRD (Attacks from Sky, Dodges the Flame at apex!) -->
  <g transform="translate(650, 52)">
    <g class="phoenix-rig">
      <!-- Celestial Cyan Aura Glow -->
      <circle cx="0" cy="0" r="28" fill="url(#bird-aura)" />

      <!-- Bird Wings (High-Frequency Flapping Motion) -->
      <g class="bird-wings-motion">
        <!-- Left Wing (Reaching high) -->
        <path d="M 0,0 C -25,-35 -45,-40 -65,-30 C -50,-15 -25,-8 0,0 Z" fill="#00f0ff" stroke="#ffffff" stroke-width="1" filter="url(#frost-glow)" opacity="0.9" />
        <path d="M -10,-5 C -35,-30 -50,-32 -60,-22 C -45,-10 -20,-5 -10,-5 Z" fill="#38bdf8" opacity="0.8" />

        <!-- Right Wing (Trailing in 3D perspective) -->
        <path d="M 0,0 C 15,-28 35,-32 50,-24 C 38,-12 20,-5 0,0 Z" fill="#00c8ff" stroke="#00f0ff" stroke-width="0.8" opacity="0.75" />
      </g>

      <!-- Sleek Aerodynamic Bird Torso -->
      <path d="M -18,2 C -6,-6 10,-4 16,4 C 8,12 -8,10 -18,2 Z" fill="#ffffff" filter="url(#frost-glow)" />

      <!-- Crest Feathers -->
      <polygon points="-12,-3 -24,-12 -16,-1" fill="#00f0ff" />
      <polygon points="-8,-4 -18,-15 -12,-2" fill="#38bdf8" />

      <!-- Radiant Beak (Diving forward aggressively) -->
      <polygon points="-18,2 -28,5 -18,7" fill="#ffdd00" filter="url(#fire-bloom)" />

      <!-- Brilliant Eye Spark -->
      <circle cx="-14" cy="2" r="1.5" fill="#003366" />
      <circle cx="-15" cy="1.5" r="0.6" fill="#ffffff" />

      <!-- Flowing Twin Plume Tail Streams (Drifting in the wind) -->
      <path d="M 14,4 C 35,10 55,2 75,12 C 55,18 35,14 14,4 Z" fill="rgba(0, 240, 255, 0.6)" filter="url(#frost-glow)" />
      <path d="M 12,6 C 30,16 50,12 68,24 C 50,26 30,20 12,6 Z" fill="rgba(112, 0, 255, 0.5)" />
    </g>
  </g>
</svg>
